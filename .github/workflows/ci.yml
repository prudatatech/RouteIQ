name: margixindia CI

# Verification only. Deploys are handled by the hosting platforms
# (backend-ts and ml-service on Railway, frontend on Vercel).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # run the checks on any branch from the Actions tab or `gh workflow run ci.yml --ref <branch>`

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-ts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:queries
      - name: No retired words in user-visible text
        run: npm run check:vocabulary

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Theme files match design/tokens.json
        run: node ../design/generate-tokens.mjs --check
      - name: Text contrast meets WCAG AA
        run: node ../design/check-contrast.mjs
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run
      - name: No retired words in user-visible text
        run: npm run check:vocabulary
      - run: npm run build

  mobile-apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [driver-app, customer-app]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  ml-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
