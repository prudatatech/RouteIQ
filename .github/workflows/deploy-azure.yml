name: Deploy to Azure
# Runs on every push to test or main that touches the apps, infra or migrations, and by hand from the
# Actions tab. The branch picks the stage: test deploys margix-test-api / -ml / -web, main deploys the live
# margix-api / -ml / -web, both in the same resource group (infra/deploy.sh --stage).
#
# It builds only what changed and deploys the parts in parallel (infra/deploy.sh --images-only):
#   backend-ts/**  -> api job  (build + push the image, roll margix-api)
#   ml-service/**  -> ml job   (build + push the image, roll margix-ml)
#   frontend/**    -> web job  (build and upload the web app)
#   infra/** or this workflow -> all three
#   run by hand    -> all three, or the ones ticked in the form
# The first job applies pending supabase/migrations to that stage's database (GitHub environment "test"
# or "production", secret DATABASE_URL). Docker layers and npm packages are cached between runs. Secrets and settings stay in Azure, where
# infra/set-secrets.sh put them, so GitHub never holds an API key. Changes to main.bicep or secrets are
# applied by running ./infra/deploy.sh or ./infra/set-secrets.sh from a signed-in machine.
#
# The deploy jobs are skipped until infra/github-oidc.sh has been run once: it creates the passwordless
# GitHub -> Azure login and stores AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID as
# repository variables. See docs/DEPLOYMENT.md section 4.4.

on:
  push:
    branches: [test, main]
    paths: ['backend-ts/**', 'ml-service/**', 'frontend/**', 'infra/**', 'supabase/migrations/**', 'scripts/db-migrate.sh', '.github/workflows/deploy-azure.yml']
  workflow_dispatch:
    inputs:
      api:
        description: Deploy the backend (margix-api)
        type: boolean
        default: true
      ml:
        description: Deploy the ML service (margix-ml)
        type: boolean
        default: true
      web:
        description: Deploy the web app
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read
  actions: read

env:
  # main is live; test (and anything else run by hand) is the test stage.
  STAGE: ${{ github.ref_name == 'main' && 'live' || 'test' }}

jobs:
  # The stage's database first: pending supabase/migrations files, dry-run then applied (scripts/db-migrate.sh).
  # A failure stops the deploy before any app changes. Skipped until the environment's DATABASE_URL secret
  # is set. Only this job uses a GitHub environment ("production" on main, "test" on test): the Azure
  # jobs must NOT, because their federated credential is bound to the branch ref, not to an environment.
  migrate:
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'test' }}
    concurrency:
      group: db-migrate-${{ github.ref_name == 'main' && 'live' || 'test' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending migrations to the ${{ github.ref_name == 'main' && 'live' || 'test' }} database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::notice::No DATABASE_URL secret in the ${{ github.ref_name == 'main' && 'production' || 'test' }} environment yet; no migrations applied."
            exit 0
          fi
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          bash scripts/db-migrate.sh --dry-run
          bash scripts/db-migrate.sh

  changes:
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.pick.outputs.api }}
      ml: ${{ steps.pick.outputs.ml }}
      web: ${{ steps.pick.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          IN_API: ${{ inputs.api }}
          IN_ML: ${{ inputs.ml }}
          IN_WEB: ${{ inputs.web }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            { echo "api=$IN_API"; echo "ml=$IN_ML"; echo "web=$IN_WEB"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          usable() { [[ -n "$1" && ! "$1" =~ ^0+$ ]] && git cat-file -e "$1^{commit}" 2>/dev/null && git merge-base --is-ancestor "$1" "$GITHUB_SHA"; }
          # Compare with the last commit that deployed successfully ON THIS BRANCH (test and main deploy
          # different stages), so a failed deploy is retried by the next push; fall back to the commit before this push. No usable base (first push, force push,
          # history gone) means deploy everything.
          base="$(gh run list --workflow deploy-azure.yml --branch "$GITHUB_REF_NAME" --status success --limit 1 \
                    --json headSha --jq '.[0].headSha // empty' 2>/dev/null || true)"
          usable "$base" || base="$BEFORE"
          if usable "$base"; then
            files="$(git diff --name-only "$base" "$GITHUB_SHA")"
            echo "Changed since $base:"; echo "$files"
          else
            echo "No usable base commit: deploying everything"
            files="infra/"
          fi
          has() { grep -Eq "$1" <<<"$files" && echo true || echo false; }
          if [[ "$(has '^(infra/|\.github/workflows/deploy-azure\.yml)')" == true ]]; then
            api=true; ml=true; web=true
          else
            api="$(has '^backend-ts/')"; ml="$(has '^ml-service/')"; web="$(has '^frontend/')"
          fi
          echo "api=$api ml=$ml web=$web"
          { echo "api=$api"; echo "ml=$ml"; echo "web=$web"; } >> "$GITHUB_OUTPUT"

  api:
    needs: [migrate, changes]
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-azure-${{ github.ref_name == 'main' && 'live' || 'test' }}-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # exposes the Actions cache token to `docker buildx --cache-to type=gha`
      - uses: crazy-max/ghaction-github-runtime@v3
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build, push and roll the api (margix-api live, margix-test-api test)
        run: ./infra/deploy.sh --stage "$STAGE" --images-only --api-only

  ml:
    needs: [migrate, changes]
    if: ${{ needs.changes.outputs.ml == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-azure-${{ github.ref_name == 'main' && 'live' || 'test' }}-ml
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build, push and roll the ml service (margix-ml live, margix-test-ml test)
        run: ./infra/deploy.sh --stage "$STAGE" --images-only --ml-only

  web:
    needs: [migrate, changes]
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-azure-${{ github.ref_name == 'main' && 'live' || 'test' }}-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and upload the web app
        env:
          # The live Supabase project's public URL and publishable key (repository variables), used by the
          # live stage only. The test stage always builds with frontend/.env.production (the TEST project).
          LIVE_SUPABASE_URL: ${{ vars.LIVE_SUPABASE_URL }}
          LIVE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LIVE_SUPABASE_PUBLISHABLE_KEY }}
        run: ./infra/deploy.sh --stage "$STAGE" --images-only --web-only
