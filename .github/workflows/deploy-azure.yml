name: Deploy to Azure

# DISABLED until you run infra/github-oidc.sh and add its three values as GitHub secrets
# (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID) plus SECRETS_ENV (the contents of
# infra/secrets.env). Until then this only runs by hand (workflow_dispatch).
# To enable pushes to main, replace the `on:` block with the commented one below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['backend-ts/**', 'ml-service/**', 'frontend/**', 'infra/**']

concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Write secrets file
        env:
          SECRETS_ENV: ${{ secrets.SECRETS_ENV }}
        run: (umask 077; printf '%s\n' "$SECRETS_ENV" > infra/secrets.env)

      - name: Deploy
        run: ./infra/deploy.sh
