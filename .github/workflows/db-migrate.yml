name: Database migrations
# Applies new files in supabase/migrations to the TEST database on every push to test (environment
# "test", secret DATABASE_URL). The LIVE database is migrated by deploy-azure.yml, as its first step,
# before the new backend rolls out.
# Each file is dry-run first (inside a transaction that is rolled back), then applied in its own
# transaction and recorded in public.app_migrations (scripts/db-migrate.sh). A failure stops here and
# nothing is half applied. Skipped, with a notice, until the environment's DATABASE_URL secret is set.
on:
  push:
    branches: [test]
    paths: ['supabase/migrations/**', 'scripts/db-migrate.sh', '.github/workflows/db-migrate.yml']
  workflow_dispatch:

concurrency:
  group: db-migrate-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::notice::No DATABASE_URL secret in this environment yet; nothing applied."
            exit 0
          fi
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          bash scripts/db-migrate.sh --dry-run
          bash scripts/db-migrate.sh
